<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sign in – BeassistScan</title>
  <meta name="robots" content="noindex, nofollow">
  <link rel="icon" type="image/png" href="/favicon.png" />
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    body { background: linear-gradient(160deg, #f5f3ff 0%, #ede9fe 50%, #f0fdf4 100%); min-height: 100vh; }
    .card-main { background: rgba(255,255,255,0.95); backdrop-filter: blur(20px); border: 1px solid rgba(139,92,246,0.15); box-shadow: 0 25px 50px -12px rgba(109,40,217,0.15); }
    .btn-violet { background: linear-gradient(135deg, #7c3aed 0%, #6d28d9 100%); box-shadow: 0 4px 15px rgba(124,58,237,0.4); transition: all .3s ease; }
    .btn-violet:hover { background: linear-gradient(135deg, #6d28d9 0%, #5b21b6 100%); transform: translateY(-1px); }
    .logo-dot { background: linear-gradient(135deg, #7c3aed, #a855f7); }
  </style>
</head>
<body class="flex items-center justify-center px-4 py-10">
  <div class="w-full max-w-md">
    <!-- Logo -->
    <a href="/en/" class="flex items-center justify-center gap-2.5 mb-8">
      <div class="logo-dot w-10 h-10 rounded-xl flex items-center justify-center shadow-lg">
        <svg class="w-5 h-5 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
        </svg>
      </div>
      <span class="text-gray-800 font-bold text-2xl tracking-tight">Beassist<span class="text-violet-600">Scan</span></span>
    </a>

    <div class="card-main rounded-2xl p-8">
      <!-- Onglets -->
      <div class="flex bg-gray-100 rounded-lg p-1 mb-6">
        <button id="tabLogin" onclick="switchTab('login')" class="flex-1 py-2 rounded-md text-sm font-semibold transition bg-white shadow text-violet-700">Sign in</button>
        <button id="tabRegister" onclick="switchTab('register')" class="flex-1 py-2 rounded-md text-sm font-semibold transition text-gray-500 hover:text-gray-700">Sign up</button>
      </div>

      <!-- Messages globaux -->
      <div id="globalSuccess" class="hidden text-sm text-green-700 bg-green-50 border border-green-200 rounded-lg px-3 py-2 mb-4"></div>

      <!-- Bouton Google -->
      <div id="googleBtnContainer" class="hidden mb-4">
        <div id="googleBtn" class="flex justify-center"></div>
        <div class="flex items-center gap-3 mt-4">
          <div class="flex-1 h-px bg-gray-200"></div>
          <span class="text-[11px] text-gray-400">or</span>
          <div class="flex-1 h-px bg-gray-200"></div>
        </div>
      </div>

      <!-- Formulaire connexion -->
      <form id="loginForm" class="space-y-4">
        <input type="email" id="loginEmail" required placeholder="Email"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        <input type="password" id="loginPassword" required placeholder="Password"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        <div id="loginError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <div id="resendBox" class="hidden text-center">
          <button type="button" id="resendBtn" class="text-xs text-violet-600 underline">Resend confirmation email</button>
        </div>
        <button type="submit" class="btn-violet w-full text-white font-bold py-3 rounded-lg text-sm">Sign in</button>
      </form>

      <!-- Formulaire inscription -->
      <form id="registerForm" class="space-y-4 hidden">
        <div class="grid grid-cols-2 gap-3">
          <input type="text" id="regFirstName" placeholder="First name"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
          <input type="text" id="regLastName" placeholder="Last name"
            class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        </div>
        <input type="text" id="regStoreName" placeholder="Your eBay store name (optional)"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        <input type="email" id="regEmail" required placeholder="Email"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        <input type="password" id="regPassword" required minlength="8" placeholder="Password (8+ characters)"
          class="w-full border border-gray-200 rounded-lg px-4 py-2.5 text-sm focus:outline-none focus:ring-2 focus:ring-violet-400" />
        <div id="registerError" class="hidden text-sm text-red-600 bg-red-50 border border-red-200 rounded-lg px-3 py-2"></div>
        <button type="submit" class="btn-violet w-full text-white font-bold py-3 rounded-lg text-sm">Create my free account</button>
        <p class="text-[11px] text-gray-400 text-center">By creating an account you agree to our <a href="/cgv.html" class="underline">Terms</a> and <a href="/politique-confidentialite.html" class="underline">Privacy Policy</a>.</p>
      </form>
    </div>

    <p class="text-center text-xs text-gray-400 mt-6"><a href="/en/" class="hover:text-violet-600">← Back to home</a></p>
  </div>

  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <script>
    function switchTab(tab) {
      const isLogin = tab === 'login';
      document.getElementById('loginForm').classList.toggle('hidden', !isLogin);
      document.getElementById('registerForm').classList.toggle('hidden', isLogin);
      document.getElementById('tabLogin').className = 'flex-1 py-2 rounded-md text-sm font-semibold transition ' + (isLogin ? 'bg-white shadow text-violet-700' : 'text-gray-500 hover:text-gray-700');
      document.getElementById('tabRegister').className = 'flex-1 py-2 rounded-md text-sm font-semibold transition ' + (!isLogin ? 'bg-white shadow text-violet-700' : 'text-gray-500 hover:text-gray-700');
    }

    // Déjà connecté ? → dashboard
    fetch('/auth/me').then(r => r.json()).then(d => {
      if (d.user) window.location.href = '/en/dashboard.html';
    });

    function showError(id, msg) {
      const el = document.getElementById(id);
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    function showSuccess(msg) {
      const el = document.getElementById('globalSuccess');
      el.textContent = msg;
      el.classList.remove('hidden');
    }

    // Message après clic sur le lien de vérification
    const verified = new URLSearchParams(location.search).get('verified');
    if (verified === 'true') showSuccess('✅ Email confirmed! You can now sign in.');
    else if (verified === 'invalid') showError('loginError', 'Invalid or expired verification link.');

    // Bouton Google (affiché uniquement si configuré côté serveur)
    fetch('/auth/google-config').then(r => r.json()).then(cfg => {
      if (!cfg.clientId) return;
      const init = () => {
        google.accounts.id.initialize({
          client_id: cfg.clientId,
          callback: async (resp) => {
            const res = await fetch('/auth/google', {
              method: 'POST',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ credential: resp.credential }),
            });
            const data = await res.json();
            if (res.ok && data.success) window.location.href = '/en/dashboard.html';
            else showError('loginError', data.error || 'Google sign-in failed');
          },
        });
        google.accounts.id.renderButton(document.getElementById('googleBtn'), {
          theme: 'outline', size: 'large', width: 320, text: 'continue_with', locale: 'en',
        });
        document.getElementById('googleBtnContainer').classList.remove('hidden');
      };
      if (window.google && google.accounts) init();
      else window.addEventListener('load', () => window.google && init());
    }).catch(() => {});

    // Renvoi de l'email de confirmation
    document.getElementById('resendBtn').addEventListener('click', async () => {
      const email = document.getElementById('loginEmail').value;
      if (!email) return showError('loginError', 'Saisissez votre email d\'abord.');
      await fetch('/auth/resend-verification', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ email }),
      });
      showSuccess('Confirmation email resent. Check your inbox.');
      document.getElementById('resendBox').classList.add('hidden');
    });

    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('loginError').classList.add('hidden');
      document.getElementById('resendBox').classList.add('hidden');
      const res = await fetch('/auth/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('loginEmail').value,
          password: document.getElementById('loginPassword').value,
        }),
      });
      const data = await res.json();
      if (res.ok && data.success) window.location.href = '/en/dashboard.html';
      else {
        showError('loginError', data.error || 'Invalid credentials');
        if (data.requiresVerification) document.getElementById('resendBox').classList.remove('hidden');
      }
    });

    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      document.getElementById('registerError').classList.add('hidden');
      const res = await fetch('/auth/register', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          email: document.getElementById('regEmail').value,
          password: document.getElementById('regPassword').value,
          firstName: document.getElementById('regFirstName').value,
          lastName: document.getElementById('regLastName').value,
          storeName: document.getElementById('regStoreName').value,
        }),
      });
      const data = await res.json();
      if (res.ok && data.success) {
        switchTab('login');
        showSuccess('📧 Account created! A confirmation email has been sent. Click the link to activate your account.');
      }
      else showError('registerError', data.error || 'Erreur lors de l\'inscription');
    });
  </script>
</body>
</html>
